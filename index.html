<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Two Sum Calc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "page-wrap">
        <header>
            <h1>Two Sum Calculator</h1>
            <p > Build your own array, pick a target, and watch the javascript algorithm solve it. </p>
        </header>

        <div class = "controls">
            <h2 class="controls-heading">Array controls</h2>

            <form id="push-form" class="control-row">
            <label for="push-input">Number to add:</label>
            <input
                type="number"
                id="push-input"
                name="push-input"
                required
                inputmode="numeric"
                >
            <button type="submit" class="btn btn-push">Push ➕</button>
            </form>
            <p class="help-text">Adds this number to the end of the array.</p>

            <div class="control-row">
            <button type="button" id="pop-btn">Pop Last Element ➖</button>
            </div>

            <div class="control-row">
                <label for="target-input">Target value:</label>
                <input
                    type="number"
                    id="target-input"
                    name="target-input"
                    inputmode="numeric"
                    value="0" >
            </div>


        </div>
        <div class="array">
            <h2 class="array-heading">Your Array</h2>
            <div id="array-display" class="array-display" >
            <p class="empty-msg">Array is empty. Push a number to get started!</p>
            </div>
        </div>

        <div class="result">
            <h2 class="result-heading">Result</h2>
            <div id="result-box" class="result-box"> Add at least two numbers to check for a Two Sum match. </div>
        </div>
        

    </div>

    <script src="script.js"></script>
    
</body>
</html>
